system:
  num_cdus: 1
  racks_per_cdu: 1
  nodes_per_rack: 469 # corrected from stale cluster_machine_list's 231; see
                      # notes/philly-validation-fix-plan.md in hpc-oda-26 --
                      # includes nodes empirically upgraded from 2-GPU to
                      # 8-GPU (and the 24 ambiguous "4-GPU" nodes, folded in)

  chassis_per_rack: 1 # was 3 (chosen so the old stale 231 node count divided
                      # evenly); compute_rack_power() requires nodes_per_rack
                      # % chassis_per_rack == 0, and no real per-rack/chassis
                      # topology data exists for Philly anyway (no power
                      # accuracy claims made for this system), so 1 keeps the
                      # reshape valid for any node count without fabricating
                      # a topology
  nodes_per_blade: 2
  switches_per_chassis: 4
  nics_per_node: 4
  rectifiers_per_chassis: 4
  nodes_per_rectifier: 4
  missing_racks: []
  down_nodes: []
  cpus_per_node: 2
  cores_per_cpu: 20
  gpus_per_node: 8
  cpu_peak_flops: 1248000000000.0  # assume Xeon E5-2690v4 CPU 64-bit
  gpu_peak_flops: 12000000000000.0 # assume 24G P40 32-bit
  cpu_fp_ratio: 0.667
  gpu_fp_ratio: 0.667
power:
  power_gpu_idle: 50
  power_gpu_max: 250
  power_cpu_idle: 90
  power_cpu_max: 270
  power_mem: 74.26
  power_nvme: 30
  power_nic: 20
  power_cdu: 8473.47
  power_switch: 250
  power_update_freq: 15
  rectifier_peak_threshold: 13670
  sivoc_loss_constant: 13
  sivoc_efficiency: 0.98
  rectifier_loss_constant: 17
  rectifier_efficiency: 0.96
  power_cost: 0.094
scheduler:
  multitenant: true
  job_arrival_time: 900
  mtbf: 11
  trace_quanta: 20
  min_wall_time: 3600
  max_wall_time: 43200
  ui_update_freq: 900
  max_nodes_per_job: 192
  job_end_probs:
    COMPLETED: 0.63
    FAILED: 0.13
    CANCELLED: 0.12
    TIMEOUT: 0.11
    NODE_FAIL: 0.01
