# RAPS system config for lux
# Generated by scripts/gen_system_config.py; comments record where each value came from.
# Table values are spec-sheet starting points -- replace them with measurements.
#
system_name: lux
system:
  num_cdus: 21  # user: 63 racks, one rack per CDU (lassen/summit convention)
  racks_per_cdu: 3  # user
  nodes_per_rack: 8  # user: 8 nodes/rack -> 504 total nodes
  chassis_per_rack: 1  # non-Cray 8-GPU servers; one chassis per rack
  nodes_per_blade: 1  # one node per blade -> 8 blades per chassis
  switches_per_chassis: 4  # hpe-cray-ex default
  nics_per_node: 9  # detected: /sys/class/infiniband
  rectifiers_per_chassis: 2  # 2 x 4 nodes = 8 nodes per rack
  nodes_per_rectifier: 4  # hpe-cray-ex default
  cpus_per_node: 2  # detected: lscpu Socket(s)
  gpus_per_node: 8  # user
  cpu_peak_flops: 5100000000000.0  # table: AMD EPYC 9575F Turin @ fp64 (5.1 TF/socket) [detected: matched from model name (AMD EPYC 9575F 64-Core Processor)]
  gpu_peak_flops: 78600000000000.0  # table: AMD Instinct MI355X @ fp64 (78.6 TF/GPU) [user]
  cpu_fp_ratio: 0.667  # achievable fraction of peak; RAPS default
  gpu_fp_ratio: 0.667  # achievable fraction of peak; RAPS default
  cores_per_cpu: 64  # detected: lscpu Core(s) per socket
  threads_per_core: 1  # detected: lscpu Thread(s) per core
power:
  power_gpu_idle: 180  # table: AMD Instinct MI355X [user]
  power_gpu_max: 1400  # table: AMD Instinct MI355X TDP [user]
  power_cpu_idle: 120  # table: AMD EPYC 9575F Turin [detected: matched from model name (AMD EPYC 9575F 64-Core Processor)]
  power_cpu_max: 400  # table: AMD EPYC 9575F Turin TDP [detected: matched from model name (AMD EPYC 9575F 64-Core Processor)]
  power_mem: 445.56  # derived: 3072 GB/node x 0.1450 W/GB [detected: /proc/meminfo MemTotal (3023 GiB usable)]
  power_nic: 20  # RAPS default, per NIC
  power_nvme: 30  # detected: /sys/class/nvme
  power_switch: 250  # hpe-cray-ex default
  power_cdu: 8473.47  # hpe-cray-ex default
  power_update_freq: 15  # RAPS default, seconds
  rectifier_peak_threshold: 13670  # hpe-cray-ex default
  sivoc_loss_constant: 13  # hpe-cray-ex default
  sivoc_efficiency: 0.98  # hpe-cray-ex default
  rectifier_loss_constant: 17  # hpe-cray-ex default
  rectifier_efficiency: 0.96  # hpe-cray-ex default
  power_cost: 0.094  # $/kWh
cooling:
  # Lux has no cooling model of its own, so it borrows Frontier's
  # (Simulator_olcf5_base, 25 CDUs x 3 cabinets) as a scaled design. Lux's 21 CDUs
  # drive Frontier CDUs 1-21 and CDUs 22-25 carry the mean active load.
  # heat_scale = Frontier peak / Lux peak heat per CDU from the RAPS power model
  # (1135.79 / 326.52 kW), so each CDU runs at the same fraction of its design
  # load. Temperatures and pressures are as computed; flows and pump/fan powers are
  # divided by heat_scale (and plant totals by Lux's 21/25 share). Not validated
  # against Lux measurements.
  cooling_efficiency: 0.945  # Frontier value
  wet_bulb_temp: 290.0
  zip_code: '37831'  # Oak Ridge, TN
  country_code: US
  fmu_path: "../models/fmu-models/Frontier/Simulator_olcf5_base.fmu"
  surrogate_path: "../models/surrogates/frontier_phase5_allheads_200h"
  fmu_num_cdus: 25
  heat_scale: 3.4785
  fmu_column_mapping:
    T_sec_r_C: "Rack Return Temperature (°C)"
    T_sec_s_C: "Rack Supply Temperature (°C)"
    p_sec_r_psig: "Rack Return Pressure (psig)"
    p_sec_s_psig: "Rack Supply Pressure (psig)"
    V_flow_sec_GPM: "Rack Flowrate (gpm)"
    T_prim_r_C: "Facility Return Temperature (°C)"
    T_prim_s_C: "Facility Supply Temperature (°C)"
    p_prim_s_psig: "Facility Supply Pressure (psig)"
    p_prim_r_psig: "Facility Return Pressure (psig)"
    V_flow_prim_GPM: "Facility Flowrate (gpm)"
    W_flow_CDUP_kW: "Work Done By CDUP (kW)"
  temperature_keys:
    - simulator_1_centralEnergyPlant_1_coolingTowerLoop_1_sources_Towb
  w_htwps_key: "simulator[1].centralEnergyPlant[1].hotWaterLoop[1].summary.W_flow_HTWP_kW"
  w_ctwps_key: "simulator[1].centralEnergyPlant[1].coolingTowerLoop[1].summary.W_flow_CTWP_kW"
  w_cts_key: "simulator[1].centralEnergyPlant[1].coolingTowerLoop[1].summary.W_flow_CT_kW"
scheduler:
  job_arrival_time: 62  # detected: sacct median inter-arrival over 7d
  mtbf: 11  # RAPS default, hours
  trace_quanta: 15  # RAPS default, seconds
  min_wall_time: 60  # RAPS default, seconds
  max_wall_time: 86400  # detected: scontrol show partition MaxTime
  ui_update_freq: 900  # RAPS default, seconds
  max_nodes_per_job: 504  # whole system; scontrol MaxNodes reported 1 (unlimited), which hangs the synthetic samplers
  job_end_probs:  # detected: sacct, 884 jobs over 7d
    COMPLETED: 0.6652
    FAILED: 0.1731
    CANCELLED: 0.1425
    TIMEOUT: 0.0192
    NODE_FAIL: 0.0
uq:
  power_gpu_uncertainty: 0.05  # RAPS defaults, shared by all systems
  power_cpu_uncertainty: 0.05
  power_mem_uncertainty: 0.05
  power_nic_uncertainty: 0.05
  power_nvme_uncertainty: 0.05
  power_cdus_uncertainty: 0.05
  power_node_uncertainty: 0.002
  power_switch_uncertainty: 0.05
  rectifier_power_uncertainty: 0.05
