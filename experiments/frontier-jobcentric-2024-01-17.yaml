# Replay of the public Frontier Job-Centric Telemetry Dataset, one day (2024-01-17).
# raps run experiments/frontier-jobcentric-2024-01-17.yaml
#
# Needs raps/dataloaders/frontier_jobcentric.py (not the private slurm/jobprofile loader).
# Replay args are the job-info table and one job-telemetry/<date_dir> partition.
#
# date_dir is the job END date in US Eastern time, so the partition holds only jobs that
# ended between 2024-01-17 05:00 UTC and 2024-01-18 05:00 UTC. Jobs that started and ended
# before 05:00 UTC are absent, so the window starts at 05:00 UTC.
# This day: 965 jobs, node-time utilization 0.66 over the window, 94% of nodes
# already busy at 05:00 UTC, largest job 6925 nodes.
system: frontier
dataloader: raps.dataloaders.frontier_jobcentric
replay:
  - /store/datasets/hpc/frontier/telemetry/frontier-completed-job-info.parquet
  - /store/datasets/hpc/frontier/telemetry/job-telemetry/2024-01-17
start: "2024-01-17T05:00:00Z"
end: "2024-01-18T05:00:00Z"
