# Replay of the public Frontier Job-Centric Telemetry Dataset, one day (2024-05-31).
# raps run experiments/frontier-jobcentric-2024-05-31.yaml
#
# Needs raps/dataloaders/frontier_jobcentric.py (not the private slurm/jobprofile loader).
# Replay args are the job-info table and one job-telemetry/<date_dir> partition.
#
# date_dir is the job END date in US Eastern time, so the partition holds only jobs that
# ended between 2024-05-31 05:00 UTC and 2024-06-01 05:00 UTC. Jobs that started and ended
# before 05:00 UTC are absent, so the window starts at 05:00 UTC.
# This day: 2173 jobs, node-time utilization 0.78 over the window, 99% of nodes
# already busy at 05:00 UTC, largest job 9132 nodes.
system: frontier
dataloader: raps.dataloaders.frontier_jobcentric
replay:
  - /store/datasets/hpc/frontier/telemetry/frontier-completed-job-info.parquet
  - /store/datasets/hpc/frontier/telemetry/job-telemetry/2024-05-31
start: "2024-05-31T05:00:00Z"
end: "2024-06-01T05:00:00Z"
